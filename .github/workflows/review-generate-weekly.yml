name: Review draft generator (weekly)

# Phase 1 entry point. Runs Monday 09:00 JST (00:00 UTC) — generates drafts
# into D1 (status='pending'). Humans approve / edit / skip them in the
# operations dashboard (op.dent-inc.com → レビュータブ → 承認待ち). The
# companion workflow `review-post-weekly.yml` drains approved drafts later in
# the day.
#
# Add new accounts to `DEFAULT` in the `determine` job below. Each account needs:
#   - KV entries: airbnb-session:{account}, airbnb-totp:{account}
#   - Setup: see operation/review/SETUP_AUTOMATION.md

on:
  schedule:
    - cron: '0 0 * * 1'  # Mon 00:00 UTC = Mon 09:00 JST
  workflow_dispatch:
    inputs:
      account:
        description: 'Single account to run (overrides matrix)'
        required: false
        type: string
      dry_run:
        description: 'Generate but do not write to D1'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: review-generate
  cancel-in-progress: false

jobs:
  # Decide which account(s) to generate for, based on what triggered the run.
  #   workflow_dispatch → the manual input account (if given)
  #   schedule          → the full configured list
  #
  # This has to be a separate job: a step-level `exit 0` does NOT skip the rest
  # of the job (it just marks that step successful and continues), and a
  # job-level `if:` cannot reference the `matrix` context. Building the matrix
  # itself is the only way to actually drop an account. Mirrors the same
  # pattern in review-post-weekly.yml.
  determine:
    name: Determine accounts
    runs-on: ubuntu-latest
    outputs:
      accounts: ${{ steps.set.outputs.accounts }}
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ACCOUNT: ${{ inputs.account }}
        run: |
          set -euo pipefail
          # Edit this list to add/remove accounts from the weekly schedule.
          #   KUZE = BRIDGE VIEW VILLA (facility code: bvv)
          #   MIM  = MIMO home
          DEFAULT='["NAGAI","KUZE","MIM"]'
          acct=""
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "${INPUT_ACCOUNT:-}" ]; then
            acct="$INPUT_ACCOUNT"
          fi
          if [ -n "$acct" ]; then
            if ! printf '%s' "$acct" | grep -qE '^[A-Za-z0-9_-]{1,32}$'; then
              echo "invalid account: $acct" >&2; exit 1
            fi
            echo "accounts=[\"$acct\"]" >> "$GITHUB_OUTPUT"
          else
            echo "accounts=$DEFAULT" >> "$GITHUB_OUTPUT"
          fi

  generate:
    name: Generate drafts (${{ matrix.account }})
    needs: determine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.determine.outputs.accounts) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: review/package-lock.json

      - name: Install deps
        working-directory: review
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate drafts
        id: generate
        working-directory: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: |
          set -o pipefail
          node generate-drafts.mjs \
            --account=${{ matrix.account }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} \
            2>&1 | tee run.log
          exit ${PIPESTATUS[0]}

      - name: Notify Slack on session-expiry
        if: failure() && hashFiles('review/run.log') != ''
        working-directory: review
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_REVIEW_CHANNEL: ${{ secrets.SLACK_REVIEW_CHANNEL }}
        run: |
          if grep -q "SESSION_EXPIRED_NO_AUTO_RECOVERY" run.log; then
            MSG=":warning: *Airbnb session expired for \`${{ matrix.account }}\`* — TOTP auto-recovery is not available for this account. Terminal.app で \`cd operation/review && node relogin.mjs ${{ matrix.account }}\` を実行 (ログイン→KVアップロード→検証まで自動)。復旧後 \`gh workflow run review-generate-weekly.yml -f account=${{ matrix.account }}\`。詳細は operation/review/SETUP_AUTOMATION.md「トラブルシューティング > セッションが切れた」。"
            curl -fsS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$(jq -nc --arg ch "$SLACK_REVIEW_CHANNEL" --arg t "$MSG" '{channel:$ch,text:$t}')"
          fi
