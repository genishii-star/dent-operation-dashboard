name: Review draft poster

# Posts drafts that humans approved in the operations dashboard / owner portal
# (op.dent-inc.com → レビュータブ → 承認待ち, or owner.dent-inc.com).
#
# Triggers:
#   - repository_dispatch (review-approved): fired by dent-data-api the moment a
#     draft is approved → "approve → auto-post" (posts within a few minutes).
#   - schedule: weekly safety net (Mon 18:00 JST) that drains anything missed.
#   - workflow_dispatch: manual run for a single account.

on:
  schedule:
    - cron: '0 9 * * 1'  # Mon 09:00 UTC = Mon 18:00 JST
  repository_dispatch:
    types: [review-approved]
  workflow_dispatch:
    inputs:
      account:
        description: 'Single account to run (overrides matrix)'
        required: false
        type: string
      dry_run:
        description: 'Read but do not post or mutate D1'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: review-post
  cancel-in-progress: false

jobs:
  # Decide which account(s) to post for, based on what triggered the run.
  #   repository_dispatch → the approved account from the payload
  #   workflow_dispatch    → the manual input account (if given)
  #   schedule             → the full configured list
  determine:
    name: Determine accounts
    runs-on: ubuntu-latest
    outputs:
      accounts: ${{ steps.set.outputs.accounts }}
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_ACCOUNT: ${{ github.event.client_payload.account }}
          INPUT_ACCOUNT: ${{ inputs.account }}
        run: |
          set -euo pipefail
          # Edit this list to add accounts to the weekly schedule.
          DEFAULT='["NAGAI","KUZE","MIM"]'
          acct=""
          if [ "$EVENT" = "repository_dispatch" ]; then
            acct="$DISPATCH_ACCOUNT"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "${INPUT_ACCOUNT:-}" ]; then
            acct="$INPUT_ACCOUNT"
          fi
          if [ -n "$acct" ]; then
            if ! printf '%s' "$acct" | grep -qE '^[A-Za-z0-9_-]{1,32}$'; then
              echo "invalid account: $acct" >&2; exit 1
            fi
            echo "accounts=[\"$acct\"]" >> "$GITHUB_OUTPUT"
          else
            echo "accounts=$DEFAULT" >> "$GITHUB_OUTPUT"
          fi

  post:
    name: Post approved drafts (${{ matrix.account }})
    needs: determine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.determine.outputs.accounts) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: review/package-lock.json

      - name: Install deps
        working-directory: review
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Post approved drafts
        working-directory: review
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # JA→EN translate at post time
        run: |
          set -o pipefail
          node post-approved.mjs \
            --account=${{ matrix.account }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} \
            2>&1 | tee run.log
          exit ${PIPESTATUS[0]}

      - name: Notify Slack on session-expiry
        if: failure() && hashFiles('review/run.log') != ''
        working-directory: review
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_REVIEW_CHANNEL: ${{ secrets.SLACK_REVIEW_CHANNEL }}
        run: |
          if grep -q "SESSION_EXPIRED_NO_AUTO_RECOVERY" run.log; then
            MSG=":warning: *Airbnb session expired for \`${{ matrix.account }}\`* — approved drafts are stuck. Terminal.app で \`cd operation/review && node relogin.mjs ${{ matrix.account }}\` を実行 (ログイン→KVアップロード→検証まで自動)。復旧後 \`gh workflow run review-post-weekly.yml -f account=${{ matrix.account }}\`。"
            curl -fsS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$(jq -nc --arg ch "$SLACK_REVIEW_CHANNEL" --arg t "$MSG" '{channel:$ch,text:$t}')"
          fi
