<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>レビュー返信 承認 / Dent</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --border: #d2d2d7;
      --accent: #007aff;
      --green: #34c759;
      --gray: #8e8e93;
      --warn: #ff9500;
      --text: #1d1d1f;
      --muted: #6e6e73;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 24px 20px 12px;
      max-width: 720px;
      margin: 0 auto;
    }
    header h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 6px;
    }
    header .sub {
      font-size: 13px;
      color: var(--muted);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }
    .banner {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .banner.err { background: #fef0f0; color: #c00; border: 1px solid #ffd0d0; }
    .banner.warn { background: #fff8e1; color: #795548; border: 1px solid #ffd54f; }
    .banner.empty { background: #eef5ff; color: #1e4d8b; border: 1px solid #cfe1ff; }
    .count-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .count-row .reload {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.reply { background: #e3f2fd; color: #1565c0; }
    .badge.review { background: #e8f5e9; color: #2e7d32; }
    .type-banner {
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-left: 4px solid;
    }
    .type-banner.review { background: #e8f5e9; border-color: #2e7d32; }
    .type-banner.reply  { background: #e3f2fd; border-color: #1565c0; }
    .type-banner .type-title { font-size: 15px; font-weight: 700; }
    .type-banner.review .type-title { color: #2e7d32; }
    .type-banner.reply  .type-title { color: #1565c0; }
    .type-banner .type-dir {
      display: inline-block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,.06);
      color: #444;
    }
    .type-banner .type-desc {
      margin-top: 5px;
      font-size: 12px;
      color: #555;
    }
    .deadline {
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 700;
    }
    .deadline .days { font-weight: 600; font-size: 12px; opacity: .9; }
    .deadline.ok      { background: #eef5ff; color: #1e4d8b; border: 1px solid #cfe1ff; }
    .deadline.soon    { background: #fff8e1; color: #8a5a00; border: 1px solid #ffd54f; }
    .deadline.expired { background: #fef0f0; color: #b00020; border: 1px solid #ffd0d0; }
    .prop {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }
    .orig {
      background: #f5f5f7;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 10px;
      white-space: pre-wrap;
      color: #333;
    }
    .orig .label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .orig.trans {
      background: #eef4ff;
      color: #1d3b6e;
      margin-top: 8px;
    }
    .orig.stay .kv {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 6px 16px;
    }
    .orig.stay .kv > div {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #e6e6ea;
      padding: 2px 0;
    }
    .orig.stay .kv span { color: var(--muted); }
    .orig.stay .kv b { font-weight: 600; color: #1d1d1f; }
    .note {
      font-size: 12px;
      color: var(--muted);
      margin: 6px 2px 0;
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      min-height: 140px;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.6;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      resize: vertical;
      margin-bottom: 12px;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    button.act {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button.act:disabled { opacity: 0.5; cursor: not-allowed; }
    button.approve { background: var(--green); color: white; }
    button.save    { background: var(--accent); color: white; }
    button.skip    { background: var(--gray); color: white; }
    .status-msg {
      font-size: 12px;
      color: var(--muted);
      margin-left: 4px;
    }
    .status-msg.err { color: #c00; }
    footer {
      max-width: 720px;
      margin: 40px auto 0;
      padding: 0 20px 30px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="h1">レビュー返信 承認</h1>
    <div class="sub" id="account-label">読み込み中…</div>
  </header>
  <main>
    <div id="banner-area"></div>
    <div class="count-row" id="count-row" style="display:none;">
      <span id="count-label"></span>
      <button class="reload" id="reload-btn" onclick="load()">↻ 再読み込み</button>
    </div>
    <div id="list"></div>
  </main>
  <footer id="footer-note">
    Dent Inc. — このページのURLは外部に共有しないでください
  </footer>

  <script>
    const API_BASE = 'https://api.dent-inc.com';
    const token = new URLSearchParams(location.search).get('token') || '';

    // ---- i18n ----
    //
    // 表示言語はアカウント単位の設定 (KV owner-lang:<account>) で決まり、
    // /owner/review-drafts が `lang` を返す。オーナーは日本語話者とは限らない
    // (例: MIM = 楊 世祥さん)。
    //
    // 注意: ここが訳すのは UI文言だけ。オーナーが実際に承認する **ドラフト本文**
    // の言語は generate-drafts.mjs が生成時に確定させている。UIだけ訳しても
    // 本文が読めなければ意味がないので、両方が同じ owner-lang を見る。
    const I18N = {
      'ja': {
        html_lang: 'ja',
        title: 'レビュー返信 承認 / Dent',
        h1: 'レビュー返信 承認',
        loading: '読み込み中…',
        reload: '↻ 再読み込み',
        footer: 'Dent Inc. — このページのURLは外部に共有しないでください',
        no_token: 'URLにトークンが含まれていません。担当者から共有された正しいURLを開いてください。',
        bad_token: 'トークンが無効か期限切れです。担当者にお問い合わせください。',
        net_err: (m) => `通信エラー: ${m}`,
        account: (a) => `アカウント: ${a}`,
        pending_count: (n) => `承認待ち: ${n} 件`,
        empty: '承認待ちの返信はありません。',
        expired: (d) => `⏰ 投稿期限切れ（${d}）`,
        expired_note: '— 投稿してもAirbnbに反映されません',
        deadline: (d) => `⏰ 投稿期限: ${d}`,
        remain_today: '今日まで',
        remain_days: (n) => `あと${n}日`,
        reply_title: '💬 お客様の口コミへ返信',
        reply_dir: 'お客様 → Dent',
        reply_desc: 'お客様が書いた口コミに公開で返信します',
        review_title: '📝 ゲストへの評価を投稿',
        review_dir: 'Dent → お客様',
        review_desc: 'お客様を評価してこちらから新規投稿します',
        no_prop: '(物件未マッチ)',
        no_guest: '(ゲスト不明)',
        orig_label: (l) => l ? `元のレビュー (${l})` : 'ゲストが書いたレビュー',
        stay_label: '予約情報',
        check_in: 'チェックイン', check_out: 'チェックアウト',
        nights: '滞在日数', nights_unit: (n) => `${n}泊`,
        guests: '人数', guests_unit: (n) => `${n}名`,
        total: '総額',
        trans_label: '日本語訳（参考・投稿されません）',
        orig_trans_label: 'ゲストのレビュー — 日本語訳（参考）',
        party: { adult: (n) => `大人${n}名`, child: (n) => `子供${n}名`, infant: (n) => `幼児${n}名`, pet: (n) => `ペット${n}匹` },
        post_note: '※ この文章を承認すると、英訳して Airbnb に投稿します（掲載は英語）。文章はそのまま編集できます。',
        approve: '✅ 承認', save: '💾 保存', skip: '⏭ スキップ',
        empty_text: '本文が空です',
        act_err: (m) => `エラー: ${m}`,
        approving: '承認中…', skipping: 'スキップ中…', saving: '保存中…',
      },
      'zh-Hant': {
        html_lang: 'zh-Hant',
        title: '評價回覆審核 / Dent',
        h1: '評價回覆審核',
        loading: '載入中…',
        reload: '↻ 重新載入',
        footer: 'Dent Inc. — 請勿將此頁面網址分享給他人',
        no_token: '網址中缺少權杖（token）。請開啟由負責人提供的正確網址。',
        bad_token: '權杖無效或已失效，請聯絡負責人。',
        net_err: (m) => `連線錯誤：${m}`,
        account: (a) => `帳號：${a}`,
        pending_count: (n) => `待審核：${n} 則`,
        empty: '目前沒有待審核的項目。',
        expired: (d) => `⏰ 已超過張貼期限（${d}）`,
        expired_note: '— 即使送出也不會顯示在 Airbnb 上',
        deadline: (d) => `⏰ 張貼期限：${d}`,
        remain_today: '今天截止',
        remain_days: (n) => `剩餘 ${n} 天`,
        reply_title: '💬 回覆房客的評價',
        reply_dir: '房客 → Dent',
        reply_desc: '公開回覆房客所留下的評價',
        review_title: '📝 張貼對房客的評價',
        review_dir: 'Dent → 房客',
        review_desc: '由我們主動張貼對這位房客的評價',
        no_prop: '（未對應到房源）',
        no_guest: '（房客不明）',
        orig_label: (l) => l ? `原始評價（${l}）` : '房客留下的評價',
        stay_label: '訂房資訊',
        check_in: '入住', check_out: '退房',
        nights: '住宿天數', nights_unit: (n) => `${n} 晚`,
        guests: '人數', guests_unit: (n) => `${n} 人`,
        total: '總金額',
        trans_label: '中文翻譯（僅供參考，不會被張貼）',
        orig_trans_label: '房客的評價 — 中文翻譯（僅供參考）',
        party: { adult: (n) => `${n} 位成人`, child: (n) => `${n} 位兒童`, infant: (n) => `${n} 位嬰兒`, pet: (n) => `${n} 隻寵物` },
        post_note: '※ 通過審核後，這段文字會翻譯成英文張貼到 Airbnb（實際刊登為英文）。可直接編輯內容。',
        approve: '✅ 通過', save: '💾 儲存', skip: '⏭ 略過',
        empty_text: '內容不可為空',
        act_err: (m) => `錯誤：${m}`,
        approving: '審核中…', skipping: '略過中…', saving: '儲存中…',
      },
    };
    // 言語が判明するまでは既定 (ja)。不明な lang が来ても壊さず ja に倒す。
    let T = I18N['ja'];

    function applyLang(lang) {
      T = I18N[lang] || I18N['ja'];
      document.documentElement.lang = T.html_lang;
      document.title = T.title;
      document.getElementById('h1').textContent = T.h1;
      document.getElementById('reload-btn').textContent = T.reload;
      document.getElementById('footer-note').textContent = T.footer;
    }

    // Airbnb の人数表記は常に英語 ("6 adults" / "2 adults, 1 infant")。
    // 訳せない語が来たら原文のまま返す (欠落させるより読める方がまし)。
    function localizeParty(label) {
      if (!label) return label;
      const parts = String(label).split(',').map(x => x.trim()).filter(Boolean);
      const out = parts.map(part => {
        const m = part.match(/^(\d+)\s+(adult|child|children|infant|pet)s?$/i);
        if (!m) return part;
        const n = m[1];
        const kind = m[2].toLowerCase();
        const key = kind === 'children' ? 'child' : kind;
        return T.party[key] ? T.party[key](n) : part;
      });
      return out.join(T.html_lang === 'ja' ? '・' : '、');
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function setBanner(html, kind) {
      const el = document.getElementById('banner-area');
      el.innerHTML = html ? `<div class="banner ${kind}">${html}</div>` : '';
    }

    async function load() {
      if (!token) {
        document.getElementById('account-label').textContent = '';
        setBanner(T.no_token, 'err');
        return;
      }
      setBanner(T.loading, 'empty');
      document.getElementById('count-row').style.display = 'none';
      document.getElementById('list').innerHTML = '';

      let data;
      try {
        const resp = await fetch(`${API_BASE}/owner/review-drafts?token=${encodeURIComponent(token)}`);
        if (resp.status === 401) {
          setBanner(T.bad_token, 'err');
          return;
        }
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        data = await resp.json();
      } catch (e) {
        setBanner(T.net_err(esc(e.message)), 'err');
        return;
      }

      // 言語はサーバが決める (アカウント単位)。描画より先に適用する。
      applyLang(data.lang);

      document.getElementById('account-label').textContent = T.account(data.account);
      setBanner('', '');

      const drafts = data.drafts || [];
      const row = document.getElementById('count-row');
      const label = document.getElementById('count-label');
      row.style.display = '';
      label.textContent = T.pending_count(drafts.length);

      const list = document.getElementById('list');
      if (drafts.length === 0) {
        setBanner(T.empty, 'empty');
        return;
      }
      list.innerHTML = drafts.map(renderCard).join('');
    }

    // Airbnb のホスト→ゲスト レビューは「チェックアウトから14日」で締切。
    // review_of_guest の締切と残り日数を算出（reply には締切がないので null）。
    function reviewDeadline(ctx) {
      if (!ctx || !ctx.check_out) return null;
      const co = new Date(ctx.check_out + 'T00:00:00');
      if (isNaN(co.getTime())) return null;
      const dl = new Date(co.getTime() + 14 * 86400000);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const days = Math.round((dl.getTime() - today.getTime()) / 86400000);
      return { month: dl.getMonth() + 1, day: dl.getDate(), days };
    }

    function deadlineBadge(dd) {
      if (!dd) return '';
      const date = `${dd.month}/${dd.day}`;
      if (dd.days < 0) {
        return `<div class="deadline expired">${esc(T.expired(date))}<span class="days">${esc(T.expired_note)}</span></div>`;
      }
      const cls = dd.days <= 3 ? 'soon' : 'ok';
      const remain = dd.days === 0 ? T.remain_today : T.remain_days(dd.days);
      return `<div class="deadline ${cls}">${esc(T.deadline(date))}<span class="days">（${esc(remain)}）</span></div>`;
    }

    function renderCard(d) {
      let ctx = {};
      try { ctx = d.context_json ? JSON.parse(d.context_json) : {}; } catch { ctx = {}; }

      const isReply = d.draft_type === 'reply';
      const typeBanner = isReply
        ? `<div class="type-banner reply">
             <div class="type-title">${esc(T.reply_title)}</div>
             <div class="type-dir">${esc(T.reply_dir)}</div>
             <div class="type-desc">${esc(T.reply_desc)}</div>
           </div>`
        : `<div class="type-banner review">
             <div class="type-title">${esc(T.review_title)}</div>
             <div class="type-dir">${esc(T.review_dir)}</div>
             <div class="type-desc">${esc(T.review_desc)}</div>
           </div>`;
      const propName = ctx.property_name || d.property_code || T.no_prop;
      const genDate = (d.generated_at || '').slice(0, 10);
      const guest = d.guest_name || T.no_guest;

      // 元レビューはゲストが書いた言語のまま。オーナーが読めない言語のことが
      // あるので、訳があれば原文の直下に併記する (何に対する返信かを判断できないと
      // 承認の可否が決められない)。
      const origBlock = isReply && ctx.original_text
        ? `<div class="orig"><span class="label">${esc(T.orig_label(ctx.language || ''))}</span>${esc(ctx.original_text)}</div>`
          + (ctx.original_translation
              ? `<div class="orig trans"><span class="label">${esc(T.orig_trans_label)}</span>${esc(ctx.original_translation)}</div>`
              : '')
        : '';
      const stayRows = [];
      if (!isReply) {
        if (ctx.check_in)  stayRows.push([T.check_in, esc(ctx.check_in)]);
        if (ctx.check_out) stayRows.push([T.check_out, esc(ctx.check_out)]);
        if (ctx.nights)    stayRows.push([T.nights, esc(T.nights_unit(ctx.nights))]);
        if (ctx.guests_label || ctx.guests) stayRows.push([T.guests, esc(ctx.guests_label ? localizeParty(ctx.guests_label) : T.guests_unit(ctx.guests))]);
        if (ctx.total_payout) stayRows.push([T.total, esc(ctx.total_payout)]);
      }
      const stayBlock = stayRows.length
        ? `<div class="orig stay"><span class="label">${esc(T.stay_label)}</span><div class="kv">${stayRows.map(([k,v]) => `<div><span>${esc(k)}</span><b>${v}</b></div>`).join('')}</div></div>`
        : '';
      // Replies are posted in the guest's language; show a gloss in the owner's
      // language as a read-only reference.
      //
      // `translation` is the owner-language gloss. `translation_ja` is the
      // pre-i18n field and is ALWAYS Japanese — only fall back to it for a
      // Japanese owner. Showing it to a zh-Hant owner would put Japanese text
      // under a 「中文翻譯」 label, i.e. mislabel content they can't read.
      const gloss = ctx.translation ?? (T.html_lang === 'ja' ? ctx.translation_ja : null);
      const transBlock = (isReply && gloss)
        ? `<div class="orig trans"><span class="label">${esc(T.trans_label)}</span>${esc(gloss)}</div>`
        : '';
      const postNote = !isReply
        ? `<div class="note">${esc(T.post_note)}</div>`
        : '';

      const deadlineHtml = isReply ? '' : deadlineBadge(reviewDeadline(ctx));

      return `
        <div class="card" data-id="${esc(d.id)}">
          ${typeBanner}
          ${deadlineHtml}
          <div class="meta">
            <span class="prop">${esc(propName)}</span>
            <span>${esc(guest)}</span>
            <span>${esc(genDate)}</span>
          </div>
          ${origBlock}
          ${stayBlock}
          <textarea class="draft-text">${esc(d.draft_text || '')}</textarea>
          ${postNote}
          ${transBlock}
          <div class="btn-row">
            <button class="act approve" onclick="act('${esc(d.id)}', 'approve')">${esc(T.approve)}</button>
            <button class="act save"    onclick="act('${esc(d.id)}', 'save')">${esc(T.save)}</button>
            <button class="act skip"    onclick="act('${esc(d.id)}', 'skip')">${esc(T.skip)}</button>
            <span class="status-msg"></span>
          </div>
        </div>
      `;
    }

    async function act(id, kind) {
      const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
      if (!card) return;
      const buttons = card.querySelectorAll('button.act');
      const status = card.querySelector('.status-msg');
      const ta = card.querySelector('.draft-text');

      let body, label;
      // Send the current textarea content on approve too, so an edit the owner
      // made but didn't explicitly save still gets captured before posting.
      if (kind === 'approve') {
        body = { status: 'approved' };
        const edited = ta.value.trim();
        if (edited) body.draft_text = edited;
        label = T.approving;
      }
      else if (kind === 'skip') { body = { status: 'rejected' }; label = T.skipping; }
      else if (kind === 'save') {
        const text = ta.value.trim();
        if (!text) { status.textContent = T.empty_text; status.classList.add('err'); return; }
        body = { draft_text: text };
        label = T.saving;
      } else return;

      buttons.forEach(b => b.disabled = true);
      status.textContent = label;
      status.classList.remove('err');

      try {
        const resp = await fetch(
          `${API_BASE}/owner/review-drafts/${encodeURIComponent(id)}?token=${encodeURIComponent(token)}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: JSON.stringify(body),
          },
        );
        const json = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(json.error || `HTTP ${resp.status}`);
        // success → reload entire list (card may have disappeared on approve/skip)
        await load();
      } catch (e) {
        status.textContent = T.act_err(e.message);
        status.classList.add('err');
        buttons.forEach(b => b.disabled = false);
      }
    }

    load();
  </script>
</body>
</html>
